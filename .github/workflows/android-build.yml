name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download Bíblia BPM offline source (USFM with verse markers)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 https://ebible.org/Scriptures/porbrbsl_usfm.zip -o /tmp/porbrbsl_usfm.zip
          echo '--- USFM archive sample ---'
          unzip -Z1 /tmp/porbrbsl_usfm.zip | grep 'GEN' | head -5
          GEN_FILE=$(unzip -Z1 /tmp/porbrbsl_usfm.zip | grep 'GEN' | head -1)
          echo "--- Genesis USFM file: $GEN_FILE ---"
          unzip -p /tmp/porbrbsl_usfm.zip "$GEN_FILE" | grep -E '^\\(id|c|v) ' | head -45
          echo '--- Catholic book codes in archive ---'
          unzip -Z1 /tmp/porbrbsl_usfm.zip | sed -n 's/.*-\([A-Z0-9]*\)porbrbsl\.usfm$/\1/p' | sort -u
          cp /tmp/porbrbsl_usfm.zip app/src/main/assets/porbrbsl_usfm.zip
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalavraViva-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
