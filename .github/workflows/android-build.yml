name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download Bíblia BPM offline source
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 https://ebible.org/Scriptures/porbrbsl_readaloud.zip -o /tmp/porbrbsl_readaloud.zip
          echo '--- BPM archive contents ---'
          unzip -l /tmp/porbrbsl_readaloud.zip | head -45
          cp /tmp/porbrbsl_readaloud.zip app/src/main/assets/porbrbsl_readaloud.zip
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PalavraViva-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
